[package]
name = "still-browser"
version = "0.4.0"
edition = "2021"
description = "Still — a quiet, minimal browser"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
still-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# Schannel (native-tls) instead of rustls: no ring C code, a smaller binary; NSIS installers need no zip.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
