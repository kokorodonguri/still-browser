<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Still</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar" data-tauri-drag-region>
      <div class="group" data-tauri-drag-region>
        <button class="icon" id="sidebar-toggle" title="Show sidebar" aria-label="Show sidebar" aria-pressed="false">
          <svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="3" /><path d="M7.5 3.5v13" /></svg>
        </button>
        <button class="icon" id="settings-toggle" title="Settings (Ctrl+,)" aria-label="Settings" aria-pressed="false">
          <svg viewBox="0 0 20 20"><path d="M8.6 2.5h2.8l.4 2 1.5.9 1.9-.7 1.4 2.4-1.5 1.4v1.9l1.5 1.3-1.4 2.4-1.9-.6-1.5.9-.4 2H8.6l-.4-2-1.5-.9-1.9.6-1.4-2.4 1.5-1.3V8.5L3.4 7.1l1.4-2.4 1.9.7 1.5-.9z" /><circle cx="10" cy="10" r="2.3" /></svg>
        </button>
        <button class="icon" id="back" title="Back" aria-label="Back" disabled>
          <svg viewBox="0 0 20 20"><path d="M12 4.5 6.5 10l5.5 5.5" /></svg>
        </button>
        <button class="icon" id="forward" title="Forward" aria-label="Forward" disabled>
          <svg viewBox="0 0 20 20"><path d="M8 4.5l5.5 5.5L8 15.5" /></svg>
        </button>
        <button class="icon" id="reload" title="Reload" aria-label="Reload" disabled>
          <svg class="when-idle" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.7-4" /><path d="M14.5 3v3.5H11" /></svg>
          <svg class="when-loading" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
        </button>
      </div>

      <form class="address" id="address-form" role="search" autocomplete="off">
        <input id="address" type="text" spellcheck="false" placeholder="Search or enter address"
               aria-label="Search or enter address" />
        <button type="button" class="icon small" id="bookmark" title="Bookmark this page" aria-label="Bookmark this page" aria-pressed="false" hidden>
          <svg viewBox="0 0 20 20"><path d="M10 3.2l2 4.3 4.6.5-3.4 3.1 1 4.6L10 13.4l-4.2 2.3 1-4.6L3.4 8l4.6-.5z" /></svg>
        </button>
        <button type="button" class="icon small" id="fill-login" title="Fill in saved password" aria-label="Fill in saved password" aria-haspopup="true" hidden>
          <svg viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.5" /><path d="M10 10h7.5M15.5 10v2.5M13 10v2" /></svg>
        </button>
        <span class="progress" aria-hidden="true"></span>
        <div class="login-picker" id="login-picker" role="menu" aria-label="Saved passwords for this site" hidden></div>
      </form>

      <div class="group" data-tauri-drag-region>
        <p class="notice" id="notice" role="status" aria-live="polite" hidden>
          <span id="notice-text"></span>
          <button class="icon small" id="notice-dismiss" title="Dismiss" aria-label="Dismiss notification">
            <svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" /></svg>
          </button>
        </p>
        <button class="pill" id="update-button" hidden>
          <svg viewBox="0 0 20 20"><path d="M10 15.5v-9M6 10l4-4 4 4M4.5 3.5h11" /></svg><span id="update-label">Update</span>
        </button>
        <button class="icon" id="downloads-indicator" title="Downloads in progress" aria-label="Downloads in progress" hidden>
          <svg viewBox="0 0 20 20"><path d="M10 3.5v9M6 9l4 4 4-4M4.5 16.5h11" /></svg>
        </button>
        <button class="icon" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
          <svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" /></svg>
        </button>
      </div>

      <div class="window-controls">
        <button class="icon" id="win-min" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 20 20"><path d="M5 10h10" /></svg>
        </button>
        <button class="icon" id="win-max" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" /></svg>
        </button>
        <button class="icon close" id="win-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar" hidden>
        <div class="segmented" role="tablist" aria-label="Sidebar sections">
          <button role="tab" id="seg-tabs" data-section="tabs" aria-selected="true" title="Tabs">
            <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2.5" /><path d="M3 8h14" /></svg>
          </button>
          <button role="tab" id="seg-bookmarks" data-section="bookmarks" aria-selected="false" title="Bookmarks">
            <svg viewBox="0 0 20 20"><path d="M6 3.5h8v13l-4-3-4 3z" /></svg>
          </button>
          <button role="tab" id="seg-history" data-section="history" aria-selected="false" title="History">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /><path d="M10 6.5V10l2.5 1.5" /></svg>
          </button>
          <button role="tab" id="seg-downloads" data-section="downloads" aria-selected="false" title="Downloads">
            <svg viewBox="0 0 20 20"><path d="M10 3.5v9M6 9l4 4 4-4M4.5 16.5h11" /></svg>
          </button>
        </div>
        <h2 class="section-title" id="section-title">Tabs</h2>
        <div class="list" id="list" role="list"></div>
      </aside>
      <section class="content" id="content" aria-label="Page">
        <div class="settings" id="settings" hidden>
          <nav class="settings-nav" aria-label="Settings">
            <h1 class="settings-heading">Settings</h1>
            <div role="tablist" aria-orientation="vertical" aria-label="Settings categories" id="settings-tabs">
              <button role="tab" id="pane-general" data-pane="general" aria-selected="true" aria-controls="settings-body">
                <svg viewBox="0 0 20 20"><path d="M4 6h8M15 6h1M4 14h2M9 14h7" /><circle cx="13.5" cy="6" r="1.5" /><circle cx="7.5" cy="14" r="1.5" /></svg>General
              </button>
              <button role="tab" id="pane-appearance" data-pane="appearance" aria-selected="false" aria-controls="settings-body" tabindex="-1">
                <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor" /></svg>Appearance
              </button>
              <button role="tab" id="pane-search" data-pane="search" aria-selected="false" aria-controls="settings-body" tabindex="-1">
                <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5" /><path d="M13 13l3.5 3.5" /></svg>Search
              </button>
              <button role="tab" id="pane-privacy" data-pane="privacy" aria-selected="false" aria-controls="settings-body" tabindex="-1">
                <svg viewBox="0 0 20 20"><path d="M10 3l5.5 2v4.5c0 3.4-2.3 6.1-5.5 7.5-3.2-1.4-5.5-4.1-5.5-7.5V5z" /></svg>Privacy
              </button>
              <button role="tab" id="pane-passwords" data-pane="passwords" aria-selected="false" aria-controls="settings-body" tabindex="-1">
                <svg viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.5" /><path d="M10 10h7.5M15.5 10v2.5M13 10v2" /></svg>Passwords
              </button>
              <button role="tab" id="pane-import" data-pane="import" aria-selected="false" aria-controls="settings-body" tabindex="-1">
                <svg viewBox="0 0 20 20"><path d="M10 3.5v9M6.5 9l3.5 3.5L13.5 9" /><path d="M4 12.5v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2" /></svg>Import
              </button>
              <button role="tab" id="pane-shortcuts" data-pane="shortcuts" aria-selected="false" aria-controls="settings-body" tabindex="-1">
                <svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2" /><path d="M6.5 12h7M6 8.5h.01M9 8.5h.01M12 8.5h.01M15 8.5h-.99" /></svg>Shortcuts
              </button>
            </div>
          </nav>
          <div class="settings-body" id="settings-body" role="tabpanel" tabindex="-1"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
