// Still for Windows: registers its settings on every start and sets up each
// browser window. The toolbar layout and the earlier build's library are
// applied once per profile. This scope has Services and ChromeUtils only;
// the rest comes from Components or a browser window.

// Firefox's own "make default" would register firefox.exe without Still's
// profile; Still's settings ask Windows for Still (still.exe --make-default).
lockPref("pref.general.disable_button.default_browser", true);
// Firefox's prompts and upgrade dialog call ShellService too, which on
// Windows 10/11 writes Firefox's own UserChoice: all of them open Windows'
// Default apps at Still instead.
try {
  let shell;
  for (const uri of ["moz-src:///browser/components/shell/ShellService.sys.mjs", "resource:///modules/ShellService.sys.mjs"]) {
    try {
      shell = ChromeUtils.importESModule(uri).ShellService;
      break;
    } catch (error) {}
  }
  const makeDefault = () => {
    const firefox = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
    const exe = firefox.parent.clone();
    exe.append("still.exe");
    const process = Components.classes["@mozilla.org/process/util;1"].createInstance(Components.interfaces.nsIProcess);
    process.init(exe);
    process.runw(false, ["--make-default"], 1);
  };
  shell.setDefaultBrowser = async () => makeDefault();
  shell.setAsDefault = () => makeDefault();
} catch (error) {
  dump(`still.cfg: ${error}\n`);
}
var stillChrome;
try {
  const manifest = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  manifest.append("still");
  manifest.append("chrome.manifest");
  // Keep the handle alive; releasing it unregisters the chrome package.
  stillChrome = Components.classes["@mozilla.org/addons/addon-manager-startup;1"]
    .getService(Components.interfaces.amIAddonManagerStartup)
    .registerChrome(Services.io.newFileURI(manifest), [["content", "still", "content/"]]);
  const startPage = "chrome://still/content/newtab.html";
  // A homepage the user never changed opens Still's page, not about:home.
  Services.prefs.getDefaultBranch("").setStringPref("browser.startup.homepage", startPage);
  // Keep Firefox's blank-page choice live, including changes after startup.
  // Only replace our own URL or Firefox's default; extensions keep control.
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  const newTabPref = "browser.newtabpage.enabled";
  const updateNewTab = () => {
    if (!Services.prefs.getBoolPref(newTabPref, true)) {
      if (AboutNewTab.newTabURL == startPage) AboutNewTab.resetNewTabURL();
    } else if (!AboutNewTab.newTabURLOverridden) {
      AboutNewTab.newTabURL = startPage;
    }
  };
  Services.prefs.addObserver(newTabPref, updateNewTab);
  // Extension removal can restore about:newtab without changing the pref.
  Services.obs.addObserver(updateNewTab, "newtab-url-changed");
  updateNewTab();
} catch (error) {
  dump(`still.cfg: ${error}\n`);
}

try {
  const started = "browser-delayed-startup-finished";
  const arrange = (win) => {
    stillWindow(win).catch((error) => win.console.error(error));
    stillTheme().catch((error) => win.console.error(error));
    stillRail(win).catch((error) => win.console.error(error));
    try {
      stillLayout(win);
    } catch (error) {
      win.console.error(error);
    }
    try {
      stillTabHosts(win);
    } catch (error) {
      win.console.error(error);
    }
  };
  Services.obs.addObserver(arrange, started);

  // Firefox seeds the library before the old Still library is added.
  const topic = "places-browser-init-complete";
  const observe = () => {
    Services.obs.removeObserver(observe, topic);
    const win = Services.wm.getMostRecentWindow("navigator:browser");
    stillImport(win).catch((error) => win.console.error(error));
  };
  Services.obs.addObserver(observe, topic);
} catch (error) {
  dump(`still.cfg: ${error}\n`);
}

async function stillWindow(win) {
  const doc = win.document;
  const root = doc.documentElement;
  root.setAttribute("data-title-default", "Still");
  root.setAttribute("data-title-private", "Still プライベートブラウジング");
  root.setAttribute("data-content-title-default", "CONTENTTITLE — Still");
  root.setAttribute("data-content-title-private", "CONTENTTITLE — Still プライベートブラウジング");

  const settings = (event) => {
    const id = event.target.closest?.("#still-settings-button, #preferences-button, #appMenu-settings-button")?.id;
    if (!id) {
      return;
    }
    event.preventDefault();
    event.stopImmediatePropagation();
    win.PanelUI.hide();
    const uri = "chrome://still/content/settings.html";
    if (!win.switchToTabHavingURI(uri, false, { ignoreFragment: "whenComparing" })) {
      win.gBrowser.selectedTab = win.gBrowser.addTrustedTab(uri);
    }
  };
  // Capture commands before CustomizableUI and PanelUI open preferences.
  win.addEventListener("command", settings, true);

  await doc.l10n.ready;
  if (win.closed) {
    return;
  }
  // Firefox 153 caches the title strings in gBrowser, rather than reading
  // the four attributes above. Replace only its brand suffix, not page titles.
  const titles = [
    [doc.getElementById("privateWindowTitle")?.textContent, "Still プライベートブラウジング"],
    [doc.getElementById("mainWindowTitle")?.textContent,
      root.getAttribute("privatebrowsingmode") == "permanent" ? "Still プライベートブラウジング" : "Still"],
  ];
  const browser = win.gBrowser;
  const titleForBrowser = browser.getWindowTitleForBrowser;
  browser.getWindowTitleForBrowser = function (...args) {
    const title = titleForBrowser.apply(this, args);
    for (const [brand, still] of titles) {
      if (brand && (title == brand || title.endsWith(` — ${brand}`))) {
        return title.slice(0, -brand.length) + still;
      }
    }
    return title;
  };
  browser.updateTitlebar();
}

// Sidebar, Back, Forward, Reload | address (centred) | Downloads, New tab.
// Firefox rebuilds the toolbar when it turns on vertical tabs, so the layout
// is applied here, after startup, rather than as a saved preference. Later
// changes the user makes in Customize Toolbar are kept.
function stillLayout(win) {
  // Move only Settings for existing profiles, preserving other toolbar choices.
  if (Services.prefs.getIntPref("still.settingsPosition", 0) < 1) {
    win.CustomizableUI.removeWidgetFromArea("preferences-button");
    Services.prefs.setIntPref("still.settingsPosition", 1);
  }
  const revision = 1;
  if (Services.prefs.getIntPref("still.windowsLayout", 0) >= revision) {
    return;
  }
  const ui = win.CustomizableUI;
  const navbar = ui.AREA_NAVBAR;
  // The tab strip's own buttons (Firefox View, all tabs, end private
  // session) are not part of Still's toolbar; springs are placed again.
  const strip = ["firefox-view-button", "alltabs-button", "reset-pbm-toolbar-button"];
  const order = [
    "sidebar-button", "back-button", "forward-button", "stop-reload-button",
    "spring", "urlbar-container", "spring",
    // Downloads shows while something downloads; Extensions once one is installed.
    "downloads-button", "new-tab-button", "unified-extensions-button",
  ];
  ui.beginBatchUpdate();
  try {
    for (const id of ui.getWidgetIdsInArea(navbar)) {
      if ((ui.isSpecialWidget(id) && id.includes("spring")) || strip.includes(id)) {
        ui.removeWidgetFromArea(id);
      }
    }
    order.forEach((id, index) => {
      if (id != "spring" && ui.getPlacementOfWidget(id)?.area == navbar) {
        ui.moveWidgetWithinArea(id, index);
      } else {
        ui.addWidgetToArea(id, navbar, index);
      }
    });
  } finally {
    ui.endBatchUpdate();
  }
  Services.prefs.setIntPref("still.windowsLayout", revision);
}

// Above the tab list: Tabs / Bookmarks / History / Downloads, then a "Tabs"
// heading, as in the earlier Still. Bookmarks and History open Firefox's own
// sidebar panels, Tabs closes them and Downloads opens about:downloads. The
// launcher's own tool buttons are hidden, since these replace them.
// The icons are in userChrome.css (#still-segment-<name>).
const STILL_SEGMENTS = [
  ["tabs", "タブ", null],
  ["bookmarks", "ブックマーク", "viewBookmarksSidebar"],
  ["history", "履歴", "viewHistorySidebar"],
  ["downloads", "ダウンロード", null],
];

async function stillRail(win) {
  const doc = win.document;
  const container = doc.getElementById("sidebar-container") || doc.getElementById("sidebar-main");
  const launcher = container?.querySelector("sidebar-main");
  if (!launcher || doc.getElementById("still-rail-header")) {
    return;
  }
  const header = doc.createXULElement("vbox");
  header.id = "still-rail-header";
  const segments = doc.createXULElement("hbox");
  segments.id = "still-segments";
  segments.setAttribute("role", "toolbar");
  const controller = win.SidebarController;
  const buttons = STILL_SEGMENTS.map(([name, label, panel]) => {
    const button = doc.createXULElement("toolbarbutton");
    button.id = `still-segment-${name}`;
    button.className = "still-segment";
    button.setAttribute("label", label);
    button.setAttribute("tooltiptext", label);
    button.addEventListener("command", () => {
      if (name == "downloads") {
        win.switchToTabHavingURI("about:downloads", true);
      } else if (panel) {
        controller.show(panel);
      } else if (controller.isOpen) {
        controller.hide();
      }
    });
    segments.append(button);
    return [button, panel];
  });
  const heading = doc.createXULElement("label");
  heading.id = "still-rail-heading";
  heading.setAttribute("value", "タブ");
  header.append(segments, heading);
  container.insertBefore(header, launcher);
  const footer = doc.createXULElement("vbox");
  footer.id = "still-rail-footer";
  const settings = doc.createXULElement("toolbarbutton");
  settings.id = "still-settings-button";
  settings.className = "tabbable";
  settings.setAttribute("tabindex", "0");
  settings.setAttribute("label", "設定");
  settings.setAttribute("tooltiptext", "Still の設定");
  footer.append(settings);
  container.append(footer);

  // Tabs is selected unless a panel is open; another panel selects nothing.
  const box = doc.getElementById("sidebar-box");
  const select = () => {
    const open = controller.isOpen ? controller.currentID : null;
    for (const [button, panel] of buttons) {
      const selected = open ? panel == open : button == buttons[0][0];
      button.toggleAttribute("selected", selected);
      button.setAttribute("aria-pressed", String(selected));
    }
  };
  select();
  new win.MutationObserver(select).observe(box, { attributes: true, attributeFilter: ["hidden", "sidebarcommand"] });

  await launcher.updateComplete;
  const style = doc.createElementNS("http://www.w3.org/1999/xhtml", "style");
  style.textContent = ".buttons-wrapper, #sidebar-tools-and-extensions-splitter { display: none !important; }";
  launcher.shadowRoot?.append(style);
}

// Each tab shows its site's host under the title. The host is kept on the
// label container, where the stylesheet reads it with attr().
function stillTabHosts(win) {
  const browser = win.gBrowser;
  const update = (tab) => {
    const container = tab?.querySelector(".tab-label-container");
    if (!container) {
      return;
    }
    let host = "";
    try {
      const uri = tab.linkedBrowser.currentURI;
      if (uri.schemeIs("http") || uri.schemeIs("https")) {
        host = uri.host.replace(/^www\./, "");
      }
    } catch {}
    if (host) {
      container.setAttribute("still-host", host);
    } else {
      container.removeAttribute("still-host");
    }
  };
  for (const tab of browser.tabs) {
    update(tab);
  }
  browser.tabContainer.addEventListener("TabOpen", (event) => update(event.target));
  browser.tabContainer.addEventListener("TabAttrModified", (event) => update(event.target));
  browser.addTabsProgressListener({
    onLocationChange(linked) {
      update(browser.getTabForBrowser(linked));
    },
  });
}

// The launcher asks for the light theme on a new or upgraded profile. Firefox
// derives its theme preferences from the active theme, so the theme itself is
// switched, once; later choices in Still's settings are kept.
async function stillTheme() {
  const pending = "still.lightThemePending";
  if (!Services.prefs.getBoolPref(pending, false)) {
    return;
  }
  Services.prefs.clearUserPref(pending);
  const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
  const { BuiltInThemes } = ChromeUtils.importESModule("resource:///modules/BuiltInThemes.sys.mjs");
  await BuiltInThemes.ensureBuiltInThemes();
  const theme = await AddonManager.getAddonByID("firefox-compact-light@mozilla.org");
  await theme?.enable();
}

async function stillImport(win) {
  const { IOUtils, PathUtils, URL } = win;
  const source = PathUtils.join(PathUtils.profileDir, "still-import.json");
  const done = PathUtils.join(PathUtils.profileDir, "still-import.done");
  if (!(await IOUtils.exists(source))) {
    return;
  }
  // Renamed before importing, so a failure never adds the same items twice.
  await IOUtils.move(source, done);
  const data = await IOUtils.readJSON(done);
  const { PlacesUtils } = ChromeUtils.importESModule("resource://gre/modules/PlacesUtils.sys.mjs");
  const web = (url) => typeof url === "string" && /^https?:\/\//i.test(url) && URL.canParse(url);
  const text = (value) => (typeof value === "string" ? value : "");

  const pages = new Map();
  for (const entry of Array.isArray(data.history) ? data.history : []) {
    const visited = Number(entry?.visited);
    if (!web(entry?.url) || !Number.isFinite(visited) || visited <= 0 || visited > Date.now()) {
      continue;
    }
    const page = pages.get(entry.url) ?? { url: entry.url, title: "", visits: [] };
    if (text(entry.title)) {
      page.title = entry.title;
    }
    page.visits.push({ date: new Date(visited), transition: PlacesUtils.history.TRANSITIONS.LINK });
    pages.set(entry.url, page);
  }
  const list = [...pages.values()].map((page) => (page.title ? page : { url: page.url, visits: page.visits }));
  for (let start = 0; start < list.length; start += 200) {
    await PlacesUtils.history.insertMany(list.slice(start, start + 200)).catch((error) => win.console.error(error));
  }

  const known = new Set();
  const children = [];
  for (const bookmark of Array.isArray(data.bookmarks) ? data.bookmarks : []) {
    if (!web(bookmark?.url) || known.has(bookmark.url)) {
      continue;
    }
    known.add(bookmark.url);
    if (!(await PlacesUtils.bookmarks.fetch({ url: bookmark.url }))) {
      children.push({ url: bookmark.url, title: text(bookmark.title) });
    }
  }
  if (children.length) {
    await PlacesUtils.bookmarks.insertTree({ guid: PlacesUtils.bookmarks.menuGuid, children });
  }
}
