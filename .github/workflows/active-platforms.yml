name: active-platforms

on:
  push:
    paths: ["linux/**", "windows/**", "desktop/src-tauri/icons/**", ".github/workflows/active-platforms.yml"]
  pull_request:
    paths: ["linux/**", "windows/**", "desktop/src-tauri/icons/**", ".github/workflows/active-platforms.yml"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux profile, migration and update tests
        run: python3 -m unittest discover -s linux/tests -p 'test_*.py' -v
      - name: Windows archive and staging tests
        run: python3 -m unittest discover -s windows/tests -v
      - name: Firefox settings tests
        run: node --test windows/tests/*.test.cjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows launcher domain tests
        working-directory: windows/launcher
        run: cargo test --locked
