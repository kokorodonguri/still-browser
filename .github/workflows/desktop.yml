# Builds and tests Still for Windows on real Windows runners. Locally the same
# build is cross-compiled from Linux (see README.md).
name: desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Domain tests
        working-directory: desktop
        run: cargo test -p still-core
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Interface typecheck and build
        working-directory: desktop/ui
        run: npm ci && npm run build

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}", components: clippy }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install interface dependencies
        working-directory: desktop/ui
        run: npm ci
      - name: Clippy (Windows-only code paths)
        working-directory: desktop
        run: npm --prefix ui run build && cargo clippy -p still-browser --target ${{ matrix.target }} -- -D warnings
      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Without the update signing key (forks, pull requests) build without update signatures.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then unsigned=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          ui/node_modules/.bin/tauri build --target ${{ matrix.target }} --ci "${unsigned[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: still-${{ matrix.target }}
          path: |
            desktop/target/${{ matrix.target }}/release/still-browser.exe
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
